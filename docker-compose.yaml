services:
  greenlight-db:
    container_name: greenlight-db
    image: postgres:latest
    environment:
      POSTGRES_USER: dzenthai
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: greenlight
    ports:
      - '5432:5432'
    volumes:
      - greenlight-data:/var/lib/postgresql/data

volumes:
  greenlight-data: